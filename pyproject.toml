[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.2.2"
description = "Bootstrap and run local Orchestra agent workflows."
requires-python = ">=3.10"

[project.scripts]
orchestra = "orchestra_cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["orchestra_cli*"]
