[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.2.0"
description = "Bootstrap and run local Orchestra agent workflows."
requires-python = ">=3.10"

[project.scripts]
orchestra = "orchestra_cli.main:main"
orchestra-ask-openclaw-agent = "orchestra_openclaw_agents.wrapper:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["orchestra_cli*", "orchestra_openclaw_agents*"]
